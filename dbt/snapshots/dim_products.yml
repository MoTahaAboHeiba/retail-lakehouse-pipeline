snapshots:
  - name: dim_products
    relation: ref('eph_products')
    config:
      schema: gold
      database: walmart
      unique_key: product_id
      strategy: timestamp
      updated_at: product_updated_timestamp
      dbt_valid_to_current: "to_date('9999-12-31')"
    columns:
      - name: dbt_scd_id
        tests: [unique, not_null]
      - name: product_id
        tests: [not_null]
      - name: dbt_valid_from
        tests: [not_null]
      - name: dbt_valid_to
        tests: [not_null]
      - name: product_name
        tests: [not_null]
      - name: category
        tests: [not_null]
      - name: brand
        tests: [not_null]
      - name: price
        tests: [not_null]

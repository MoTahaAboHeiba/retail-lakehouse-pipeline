version: 2

snapshots:
  - name: dim_customers
    columns:
      - name: dbt_scd_id
        tests: [unique, not_null]
      - name: customer_id
        tests: [not_null]
      - name: dbt_valid_from
        tests: [not_null]
      - name: dbt_valid_to
        tests: [not_null]
      - name: customer_email
        tests: [not_null]

  - name: dim_employees
    columns:
      - name: dbt_scd_id
        tests: [unique, not_null]
      - name: employee_id
        tests: [not_null]
      - name: store_id
        tests: [not_null]
      - name: job_title
        tests: [not_null]
      - name: salary
        tests: [not_null]
      - name: employee_is_active
        tests: [not_null]

  - name: dim_orders
    columns:
      - name: dbt_scd_id
        tests: [unique, not_null]
      - name: order_id
        tests: [not_null]
      - name: dbt_valid_from
        tests: [not_null]
      - name: dbt_valid_to
        tests: [not_null]
      - name: order_status
        tests: [not_null]
      - name: payment_method
        tests: [not_null]

  - name: dim_products
    columns:
      - name: dbt_scd_id
        tests: [unique, not_null]
      - name: product_id
        tests: [not_null]
      - name: dbt_valid_from
        tests: [not_null]
      - name: dbt_valid_to
        tests: [not_null]
      - name: product_name
        tests: [not_null]
      - name: category
        tests: [not_null]
      - name: brand
        tests: [not_null]
      - name: price
        tests: [not_null]

  - name: dim_stores
    columns:
      - name: dbt_scd_id
        tests: [unique, not_null]
      - name: store_id
        tests: [not_null]
      - name: dbt_valid_from
        tests: [not_null]
      - name: dbt_valid_to
        tests: [not_null]
      - name: store_name
        tests: [not_null]

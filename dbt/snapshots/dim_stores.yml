snapshots:
  - name: dim_stores
    relation: ref('eph_stores')
    config:
      schema: gold
      database: walmart
      unique_key: store_id
      strategy: timestamp
      updated_at: store_updated_timestamp
      dbt_valid_to_current: "to_date('9999-12-31')"
    columns:
      - name: dbt_scd_id
        tests: [unique, not_null]
      - name: store_id
        tests: [not_null]
      - name: dbt_valid_from
        tests: [not_null]
      - name: dbt_valid_to
        tests: [not_null]
      - name: store_name
        tests: [not_null]

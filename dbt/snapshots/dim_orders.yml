snapshots:
  - name: dim_orders
    relation: ref('eph_orders')
    config:
      schema: gold
      database: walmart
      unique_key: order_id
      strategy: timestamp
      updated_at: order_updated_timestamp
      dbt_valid_to_current: "to_date('9999-12-31')"
    columns:
      - name: dbt_scd_id
        tests: [unique, not_null]
      - name: order_id
        tests: [not_null]
      - name: dbt_valid_from
        tests: [not_null]
      - name: dbt_valid_to
        tests: [not_null]
      - name: order_status
        tests: [not_null]
      - name: payment_method
        tests: [not_null]

version: 3

models:
  - name: fact_orders
    description: >
      Gold-layer fact table at order line item grain, sourced from obt_business,
      joined against dimension snapshots at order_timestamp for point-in-time SCD2 resolution.
    columns:
      - name: order_item_id
        data_tests:
          - not_null
          - unique
      - name: order_id
        data_tests:
          - not_null
      - name: customer_scd_id
        data_tests:
          - not_null
      - name: product_scd_id
        data_tests:
          - not_null
      - name: store_scd_id
        data_tests:
          - not_null
      - name: order_scd_id
        data_tests:
          - not_null

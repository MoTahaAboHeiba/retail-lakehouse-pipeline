walmart_project:
  outputs:
    dev:
      type: databricks
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'walmart') }}"
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      schema: "{{ env_var('DATABRICKS_SCHEMA', 'dbt_schema') }}"
      threads: "{{ env_var('DBT_THREADS', '1') | int }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
  target: dev

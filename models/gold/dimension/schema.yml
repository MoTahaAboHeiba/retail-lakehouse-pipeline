version: 2

models:
  - name: dim_supplier
    config:
      tags: [ci]
    description: >
      Supplier dimension, SCD Type 1 (latest state only, no history tracking).
      Full table rebuild each run given low row volume, not incremental.
      Thin dimension by design: source data carries only supplier_id and
      supplier_name, no region, contact, or lead-time attributes exist in
      the synthetic dataset.
    columns:
      - name: supplier_id
        description: Business key, primary key of this dimension.
        data_tests:
          - not_null
          - unique
      - name: supplier_name
        description: Only descriptive attribute available in source data.
        data_tests:
          - not_null
  - name: dim_date
    config:
      tags: [ci]
    description: >
      Calendar dimension. Date range dynamically derived from the min/max
      dates across supplier_deliveries_tech and orders_tech, with a 30-day
      buffer on each side, not a static hardcoded range. Buffer exists as
      insurance against timing gaps between dimension rebuild and new fact
      data arrival, not a business requirement.
    columns:
      - name: date_id
        description: Surrogate key, yyyyMMdd integer format.
        data_tests:
          - not_null
          - unique
      - name: calendar_date
        description: The actual date value.
        data_tests:
          - not_null
  - name: dim_products_current
    config:
      tags: [ci]
    description: >
      Current-state-only view of dim_products, one row per product.
      Power BI outrigger table, not a modeling-layer conformed dimension.
      Carries two key columns because it serves two facts that resolved
      product surrogate keys differently: dbt_scd_id relates to
      fact_supplier_deliveries, which already resolves product_scd_id to
      current-state at build time. product_id relates to fact_orders,
      which resolves product_scd_id point-in-time for historical accuracy
      and will not match current-state dbt_scd_id for any product with
      version history.
    columns:
      - name: dbt_scd_id
        tests: [unique, not_null]
      - name: product_id
        tests: [unique, not_null]